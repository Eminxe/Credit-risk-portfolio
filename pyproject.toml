[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plata-risk-casebook"
version = "0.1.0"
description = "Reproducible public-data credit risk research with explicit economic scenarios"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
  "scikit-learn>=1.6,<1.8", "matplotlib>=3.9,<4", "pyarrow>=18,<24",
  "PyYAML>=6,<7", "xlrd>=2,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4",
  "jupyterlab>=4.3,<5", "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1",
  "openpyxl>=3.1,<4", "ucimlrepo>=0.0.7,<1", "statsmodels>=0.14,<1", "plotly>=6,<7",
  "joblib>=1.4,<2", "nbconvert>=7,<8", "mistune>=3,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
advanced = ["xgboost>=2,<4", "lightgbm>=4,<5", "catboost>=1.2,<2", "shap>=0.46,<1", "cvxpy>=1.6,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
